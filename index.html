<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAYLAZLAR</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        
        /* Age Verification Modal */
        .age-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .age-modal.hidden {
            display: none;
        }
        
        .age-modal-content {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }
        
        .age-modal h2 {
            margin-bottom: 30px;
            font-size: 24px;
            line-height: 1.4;
        }
        
        .age-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        .age-btn {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
        .btn-yes {
            background-color: #ff0000;
            color: white;
        }
        
        .btn-no {
            background-color: #666;
            color: white;
        }
        
        /* Main Site Content */
        .site-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 100%;
            height: auto;
        }
        
        .video-section {
            text-align: center;
        }
        
        .video-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ff0000;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
        }
        
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .video-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Age Verification Modal -->
    <div class="age-modal" id="ageModal">
        <div class="age-modal-content">
            <h2>Hey Bekle! Bu Site Yetişkinlere Yönelik İçerik İçeriyor<br>Görüntülemeye Devam Etmek İçin Yaşını Onayla.</h2>
            <div class="age-buttons">
                <button class="age-btn btn-yes" onclick="confirmAge()">18 Yaşından Büyüğüm</button>
                <button class="age-btn btn-no" onclick="denyAge()">18 Yaşından Küçüğüm</button>
            </div>
        </div>
    </div>

    <!-- Main Site Content -->
    <div class="site-container" id="mainContent">
        <div class="logo">
            <img src="1000109366.png" alt="HAYLAZLAR Logo">
        </div>
        
        <div class="video-section">
            <h1 class="video-title">Haylaz Kız Üvey Babası Tarafından Cezalandırılıyor</h1>
            <div class="video-wrapper">
                <img src="Screenshot_2026-11-23-13-06-05-825_com.lemon.lvoverseas-edit.jpg" 
                     alt="Video Thumbnail" 
                     class="video-thumbnail" 
                     onclick="playVideo()">
                <video id="videoPlayer" controls style="display:none;">
                    <source src="lv_0_20261123130526.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <script>
        function confirmAge() {
            document.getElementById('ageModal').classList.add('hidden');
        }
        
        function denyAge() {
            window.location.href = "https://www.google.com";
        }
        
        function playVideo() {
            document.querySelector('.video-thumbnail').style.display = 'none';
            document.getElementById('videoPlayer').style.display = 'block';
            document.getElementById('videoPlayer').play();
        }
    </script>
</body>
</html>
